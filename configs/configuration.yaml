camera:
  id: cam_01
  source: "${CAMERA_SOURCE:-0}"
  reconnect_sec: 2.0
  read_timeout_sec: 5.0

models:
  person_tracker:
    path: "models/yolov8n.onnx"
    confidence: 0.50

  ppe_detector:
    path: "models/ppe_v2.onnx"   # <--- НОВАЯ МОДЕЛЬ
    confidence: 0.25

  smoke_fire_detector:
    path: "models/smoke_fire_detector.onnx"
    confidence: 0.60
  
  spill_detector:                  # <--- НОВАЯ МОДЕЛЬ
    path: "models/spill_detector.onnx"
    confidence: 0.40
zones:
  restricted_01:
    polygon:
      - [0.10, 0.40]
      - [0.90, 0.40]
      - [0.90, 0.95]
      - [0.10, 0.95]

events:
  temporal_confirmation:
    n: 3
    m: 5
  cooldown_sec: 10
  evidence_dir: "events"
  snapshot_format: "jpg"

logging:
  dir: "logs"
  level: "INFO"
  max_bytes: 5000000
  backup_count: 5

api:
  host: "0.0.0.0"
  port: 8000
