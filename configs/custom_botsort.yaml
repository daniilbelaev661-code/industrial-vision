tracker_type: bytetrack

# Пороги детекции
track_high_thresh: 0.4    # Уверенность для основного сопоставления
track_low_thresh: 0.1     # Уверенность для второго шанса (когда человек в дыму)
new_track_thresh: 0.6     # Создавать новый трек только при уверенности > 60%

# Настройки памяти
track_buffer: 250         # <--- ХРАНИМ ПАМЯТЬ 250 КАДРОВ (10 СЕКУНД)!
match_thresh: 0.8         # Стандартный порог

# Обязательные
fuse_score: True
gmc_method: sparseOptFlow